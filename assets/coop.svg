<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Sharing a device with an agent in the browser</title>
  <desc id="d">Three views of the web client. First, the banner reads claude is driving with a Take over button, the screen glows, and the agent's cursor sits on Sign in. Second, a finger is on the screen and the banner reads claude is waiting for you. Third, a red box marks part of the screen and the Flag for agent card is open with a note field, Watch while I reproduce it, and Send.</desc>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #0F172A; }
    .muted { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B1120; }
      .ink { fill: #F1F5F9; }
      .muted { fill: #94A3B8; }
    }
    text { font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .cap { font-size: 17px; font-weight: 700; }
    .sub { font-size: 14px; }
    .ui { font-size: 13px; }
    .btn { font-size: 11.5px; font-weight: 600; }
    .glow { animation: glow 2s ease-in-out infinite; }
    @keyframes glow { 50% { stroke-opacity: 0.12; } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
  <rect class="bg" width="960" height="470" rx="16"/>

  <!-- 1: the agent is driving -->
  <g transform="translate(20,20)">
    <rect width="290" height="350" rx="16" fill="#0B1120"/>
    <g transform="translate(29,14)">
      <rect width="232" height="32" rx="16" fill="#1C1C1E" stroke="#0A84FF" stroke-width="1.5"/>
      <text class="ui" x="16" y="21" fill="#F2F2F7">claude is driving</text>
      <rect x="152" y="5" width="74" height="22" rx="11" fill="#0A84FF"/>
      <text class="btn" x="189" y="20" text-anchor="middle" fill="#FFFFFF">Take over</text>
    </g>
    <rect class="glow" x="70" y="60" width="150" height="280" rx="14" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="10"/>
    <rect x="70" y="60" width="150" height="280" rx="14" fill="#111827" stroke="#0A84FF" stroke-width="2.5"/>
    <rect x="88" y="88" width="88" height="10" rx="5" fill="#334155"/>
    <rect x="88" y="112" width="114" height="20" rx="5" fill="#1F2937"/>
    <rect x="88" y="140" width="114" height="20" rx="5" fill="#1F2937"/>
    <rect x="88" y="186" width="114" height="32" rx="10" fill="#2DD4BF"/>
    <text class="ui" x="145" y="207" text-anchor="middle" font-weight="700" fill="#0B1120">Sign in</text>
    <g transform="translate(160,200)">
      <path d="M0 0 L0 20 L5 15 L9 24 L13 22 L9 14 L16 14 Z" fill="rgb(236,72,153)" stroke="#FFFFFF" stroke-width="1.5"/>
      <g transform="translate(12,22)">
        <rect width="50" height="18" rx="9" fill="rgb(236,72,153)"/>
        <text x="25" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">claude</text>
      </g>
    </g>
    <text class="cap ink" x="145" y="400" text-anchor="middle">The agent is driving</text>
    <text class="sub muted" x="145" y="424" text-anchor="middle">Its cursor moves to each tap first,</text>
    <text class="sub muted" x="145" y="444" text-anchor="middle">and the device glows.</text>
  </g>

  <!-- 2: you touch the screen -->
  <g transform="translate(335,20)">
    <rect width="290" height="350" rx="16" fill="#0B1120"/>
    <g transform="translate(45,14)">
      <rect width="200" height="32" rx="16" fill="#1C1C1E" stroke="#FF9F0A" stroke-width="1.5"/>
      <text class="ui" x="100" y="21" text-anchor="middle" fill="#F2F2F7">claude is waiting for you</text>
    </g>
    <rect x="70" y="60" width="150" height="280" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="88" y="88" width="88" height="10" rx="5" fill="#334155"/>
    <rect x="88" y="112" width="114" height="20" rx="5" fill="#1F2937"/>
    <rect x="88" y="140" width="114" height="20" rx="5" fill="#1F2937"/>
    <rect x="88" y="186" width="114" height="32" rx="10" fill="#2DD4BF"/>
    <text class="ui" x="145" y="207" text-anchor="middle" font-weight="700" fill="#0B1120">Sign in</text>
    <g opacity="0.4" transform="translate(166,194)">
      <path d="M0 0 L0 20 L5 15 L9 24 L13 22 L9 14 L16 14 Z" fill="rgb(236,72,153)" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
    <circle cx="120" cy="280" r="19" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="120" cy="280" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
    <text class="cap ink" x="145" y="400" text-anchor="middle">You touch the screen</text>
    <text class="sub muted" x="145" y="424" text-anchor="middle">The agent's input is refused</text>
    <text class="sub muted" x="145" y="444" text-anchor="middle">until you let go.</text>
  </g>

  <!-- 3: you flag what's wrong -->
  <g transform="translate(650,20)">
    <rect width="290" height="350" rx="16" fill="#0B1120"/>
    <rect x="70" y="20" width="150" height="320" rx="14" fill="#111827"/>
    <rect x="88" y="48" width="88" height="10" rx="5" fill="#334155"/>
    <rect x="88" y="72" width="114" height="20" rx="5" fill="#1F2937"/>
    <rect x="88" y="100" width="114" height="20" rx="5" fill="#1F2937"/>
    <rect x="88" y="146" width="114" height="32" rx="10" fill="#2DD4BF"/>
    <path fill="#000000" fill-opacity="0.5" fill-rule="evenodd" d="M84 20 h122 a14 14 0 0 1 14 14 v292 a14 14 0 0 1 -14 14 h-122 a14 14 0 0 1 -14 -14 v-292 a14 14 0 0 1 14 -14 Z M80 62 v66 h130 v-66 Z"/>
    <rect x="80" y="62" width="130" height="66" fill="none" stroke="#FF453A" stroke-width="2"/>
    <g transform="translate(25,206)">
      <rect width="240" height="126" rx="12" fill="#1C1C1E" stroke="#3A3A3C"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#F2F2F7">Flag for agent</text>
      <rect x="14" y="34" width="212" height="28" rx="6" fill="#2C2C2E"/>
      <text x="22" y="52" font-size="12" fill="#8E8E93">What looks off? (optional)</text>
      <rect x="14" y="72" width="12" height="12" rx="3" fill="none" stroke="#8E8E93"/>
      <text x="32" y="82" font-size="12" fill="#D1D1D6">Watch while I reproduce it</text>
      <text x="14" y="112" font-size="12" fill="#0A84FF">Clear Box</text>
      <text x="124" y="112" font-size="12" fill="#0A84FF">Cancel</text>
      <rect x="174" y="96" width="52" height="22" rx="11" fill="#0A84FF"/>
      <text class="btn" x="200" y="111" text-anchor="middle" fill="#FFFFFF">Send</text>
    </g>
    <text class="cap ink" x="145" y="400" text-anchor="middle">You flag what's wrong</text>
    <text class="sub muted" x="145" y="424" text-anchor="middle">The note, screenshot and UI tree</text>
    <text class="sub muted" x="145" y="444" text-anchor="middle">go to the agent.</text>
  </g>
</svg>
