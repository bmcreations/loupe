name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # target.Synthetic runs ffmpeg, and the cmd/uiprobe tests that open a
      # /wt session skip without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The private repo layers its own paths on top of this one and checks
      # that none of its strings reach the shared files.
      - name: private layer guard
        if: hashFiles('tools/layer/guard.sh') != ''
        run: tools/layer/guard.sh tree

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: make vet

      - name: test
        run: make test
